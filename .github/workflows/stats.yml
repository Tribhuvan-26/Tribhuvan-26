name: Update Telemetry

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render telemetry panel
        run: python scripts/telemetry.py Tribhuvan-26 profile/telemetry.svg scripts/fonts
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/telemetry.svg
          git commit -m "Update telemetry" || echo "No changes to commit"
          git push
